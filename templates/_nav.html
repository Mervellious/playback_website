{# Nav row: menu button left, centred logo, divider (drawn by .topbar::after).
   Pass logo_h1=true on the homepage, where the logo is the page's <h1>. #}
<header class="topbar">
  <button class="menu-btn glow-btn" type="button" aria-label="Open menu"
          aria-expanded="false" aria-controls="site-menu" data-menu-open>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>

  {% if logo_h1 %}
  <h1 class="logo"><a href="{{ url_for('index') }}">PLAYBACK</a></h1>
  {% else %}
  <a class="logo" href="{{ url_for('index') }}">PLAYBACK</a>
  {% endif %}
</header>
